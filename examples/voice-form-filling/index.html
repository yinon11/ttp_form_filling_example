<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice Form Filling — TTP Example</title>
    <link rel="stylesheet" href="../../shared/base.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <p class="eyebrow">
        <a href="../../index.html">← All examples</a>
      </p>
      <h1>Contact Form</h1>
      <p class="lead">
        Phase 1 — a plain form. In later phases a TTP voice agent will fill these
        fields for you and submit them by voice.
      </p>

      <form id="contact-form" class="card" novalidate>
        <!--
          Each field is wrapped in a .field block:
            <div class="field">
              <label>...</label>
              <input / select ... />
              <p class="error"></p>   <- validation message target
            </div>
          The name attribute on each control is the canonical field key used by
          the JS API (window.TTPFormFiller) and, later, by the voice agent's
          client tool.
        -->

        <div class="field">
          <label for="firstName">First name</label>
          <input
            type="text"
            id="firstName"
            name="firstName"
            autocomplete="given-name"
            placeholder="e.g. Mehmet"
          />
          <p class="error" data-error-for="firstName"></p>
        </div>

        <div class="field">
          <label for="lastName">Last name</label>
          <input
            type="text"
            id="lastName"
            name="lastName"
            autocomplete="family-name"
            placeholder="e.g. Yılmaz"
          />
          <p class="error" data-error-for="lastName"></p>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            autocomplete="tel"
            placeholder="e.g. +90 532 123 45 67"
          />
          <p class="hint">Turkish number — mobile or landline.</p>
          <p class="error" data-error-for="phone"></p>
        </div>

        <div class="field">
          <label for="city">City</label>
          <select id="city" name="city">
            <option value="" selected disabled>Select a city…</option>
            <option value="istanbul">Istanbul</option>
            <option value="ankara">Ankara</option>
            <option value="izmir">Izmir</option>
            <option value="antalya">Antalya</option>
          </select>
          <p class="error" data-error-for="city"></p>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Submit</button>
          <button type="button" class="btn btn-ghost" id="reset-btn">
            Reset
          </button>
        </div>
      </form>

      <!--
        Submitted-data panel. Hidden until submit succeeds. Doubles as the
        "show on screen what we've sent" surface for phase 3 (voice submit).
      -->
      <section id="result" class="card result" hidden>
        <h2>Submitted ✓</h2>
        <p class="lead">This is the data that would be sent to your backend:</p>
        <pre id="result-json"></pre>
      </section>
    </main>

    <script src="app.js"></script>

    <!--
      TTP voice agent widget + client tools.

      IMPORTANT (this is the point of the example):
      A real form is usually NOT built for voice. So instead of relying on a
      tidy pre-built API, the fill handler below takes whatever field(s) the
      agent sends and, with an explicit `switch`, maps each one to the concrete
      DOM control on THIS page — set the value, fire the events the form expects.
      Copy this pattern onto your own form: add a `case` per field you support.

      Tool names MUST match the client tools configured on the agent:
        - fill_contact_field({ firstName?, lastName?, phone?, city? })
              fills one OR several fields in a single call (the user may say two
              things in one sentence, e.g. "I'm Mehmet Yılmaz").
        - submit_form()   -> submits the form and shows the result on screen.
    -->
    <script src="https://unpkg.com/ttp-agent-sdk@2.48.0/dist/agent-widget.js"></script>
    <script>
      (function () {
        var widget = new TTPAgentSDK.TTPChatWidget({
          agentId: "agent_6061abed2",
          appId: "app_wNGQKiMUfUT5JdVIaxzXOJfdcgBegxGY5hZo",
        });

        // The fields this form knows about. To support a new field, add it here
        // and add a matching `case` in fillOneField() below.
        var KNOWN_FIELDS = ["firstName", "lastName", "phone", "city"];

        // ---- small DOM helpers ------------------------------------------------

        // Set a control's value and fire the events a real keystroke would, so
        // the form's OWN listeners (validation, error-clearing, etc.) still run.
        function applyValue(el, value) {
          el.value = value;
          el.dispatchEvent(new Event("input", { bubbles: true }));
          el.dispatchEvent(new Event("change", { bubbles: true }));
          flash(el);
        }

        // Brief visual cue so you can watch the agent fill each field.
        function flash(el) {
          var block = el.closest(".field");
          if (!block) return;
          block.classList.remove("just-filled");
          void block.offsetWidth; // restart the CSS animation
          block.classList.add("just-filled");
        }

        // ---- per-field mapping (the "switch") ---------------------------------
        // Given a field name + the value the user said, do the specific thing
        // needed to set THAT control on this form. Returns { ok, value?, error? }.
        function fillOneField(field, rawValue) {
          var value = (rawValue == null ? "" : String(rawValue)).trim();

          switch (field) {
            case "firstName":
            case "lastName": {
              var textEl = document.getElementById(field);
              if (!textEl) return { ok: false, error: "Field '" + field + "' not found." };
              if (!value) return { ok: false, error: "Value is empty." };
              applyValue(textEl, value);
              return { ok: true, value: value };
            }

            case "phone": {
              var phoneEl = document.getElementById("phone");
              if (!phoneEl) return { ok: false, error: "Phone field not found." };
              // Turkish number: keep digits, drop +90 / 90 / leading 0 -> want 10 digits.
              var digits = value.replace(/[^\d+]/g, "");
              if (digits.indexOf("+90") === 0) digits = digits.slice(3);
              else if (digits.indexOf("90") === 0 && digits.length === 12) digits = digits.slice(2);
              else if (digits.charAt(0) === "0") digits = digits.slice(1);
              digits = digits.replace(/\D/g, "");
              if (digits.length !== 10) {
                return { ok: false, error: "Not a valid Turkish phone number (need 10 digits, e.g. 532 123 45 67)." };
              }
              var normalized = "+90" + digits;
              applyValue(phoneEl, normalized);
              return { ok: true, value: normalized };
            }

            case "city": {
              var selectEl = document.getElementById("city");
              if (!selectEl) return { ok: false, error: "City field not found." };
              // Match what the user said against the <option> value OR its label,
              // case-insensitively (Turkish locale for the İ/ı dotted-i quirk).
              var want = value.toLocaleLowerCase("tr");
              var match = Array.prototype.find.call(selectEl.options, function (opt) {
                if (!opt.value) return false; // skip the "Select a city…" placeholder
                return (
                  opt.value.toLowerCase() === want ||
                  opt.textContent.trim().toLocaleLowerCase("tr") === want
                );
              });
              if (!match) {
                var choices = Array.prototype.map
                  .call(selectEl.options, function (o) { return o.value; })
                  .filter(Boolean)
                  .join(", ");
                return { ok: false, error: "City must be one of: " + choices + "." };
              }
              applyValue(selectEl, match.value);
              return { ok: true, value: match.value };
            }

            default:
              return { ok: false, error: "Unknown field: " + field };
          }
        }

        // Required fields still empty on the page (so the agent knows what to ask next).
        function remainingFields() {
          return KNOWN_FIELDS.filter(function (f) {
            var el = document.getElementById(f);
            return !el || !el.value.trim();
          });
        }

        // ---- Client tool: fill one or more fields -----------------------------
        // params: { firstName?, lastName?, phone?, city? }
        //   (also tolerates a single { field, value } pair)
        // returns: { ok, updated, errors, remaining }
        widget.registerToolHandler("fill_contact_field", async function (params) {
          params = params || {};

          // Normalize whatever shape the agent sent into a field -> value map.
          var incoming = {};
          if (params.field) {
            incoming[params.field] = params.value; // single { field, value } pair
          } else {
            KNOWN_FIELDS.forEach(function (f) {
              if (params[f] != null && params[f] !== "") incoming[f] = params[f];
            });
          }

          var updated = {};
          var errors = {};

          // Handle each field the user mentioned — could be one, could be several.
          Object.keys(incoming).forEach(function (field) {
            var res = fillOneField(field, incoming[field]);
            if (res.ok) updated[field] = res.value;
            else errors[field] = res.error;
          });

          return {
            ok: Object.keys(errors).length === 0 && Object.keys(updated).length > 0,
            updated: updated,
            errors: errors,
            remaining: remainingFields(),
          };
        });

        // ---- Client tool: submit ----------------------------------------------
        // Triggers the form's OWN submit (like clicking the button) and reads the
        // outcome back from the DOM — no special API needed.
        // returns: { ok, data } on success, or { ok:false, errors } on failure.
        widget.registerToolHandler("submit_form", async function () {
          var form = document.getElementById("contact-form");
          if (!form) return { ok: false, error: "Form not found." };

          if (typeof form.requestSubmit === "function") form.requestSubmit();
          else form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));

          // Did the form's result panel appear? Then it submitted.
          var resultPanel = document.getElementById("result");
          if (resultPanel && !resultPanel.hidden) {
            var data = {};
            KNOWN_FIELDS.forEach(function (f) {
              var el = document.getElementById(f);
              data[f] = el ? el.value.trim() : "";
            });
            return { ok: true, data: data };
          }

          // Otherwise collect the inline error messages the form displayed.
          var errors = {};
          form.querySelectorAll(".error").forEach(function (e) {
            var key = e.getAttribute("data-error-for");
            if (key && e.textContent.trim()) errors[key] = e.textContent.trim();
          });
          return { ok: false, errors: errors };
        });
      })();
    </script>
  </body>
</html>
